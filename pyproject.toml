[project]
name = "employee-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "black", "ruff", "pre-commit"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
